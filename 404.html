<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Paul Junsuk Han</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/site/favicon-32x32.png">
  <link rel="stylesheet" href="/styles/global.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .error-window {
      max-width: 420px;
      width: calc(100% - 2rem);
      background: var(--window-bg, #f5e6d3);
      border: 1px solid var(--window-border, #888);
      border-radius: 6px 6px 2px 2px;
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.15);
      overflow: hidden;
    }
    .error-title-bar {
      background: var(--menu-bg, #eee);
      border-bottom: 1px solid var(--window-border, #888);
      padding: 4px 10px;
      font-size: 12px;
      letter-spacing: 0.05em;
    }
    .error-body {
      padding: 1.5rem;
      text-align: center;
    }
    .error-body .glyph { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .error-body h1 { font-size: 1.2rem; margin: 0 0 0.5rem; }
    .error-body p { margin: 0 0 1.25rem; font-size: 0.9rem; opacity: 0.85; }
    .error-body a {
      display: inline-block;
      padding: 0.4rem 1.1rem;
      border: 1px solid var(--window-border, #888);
      border-radius: 4px;
      background: var(--menu-bg, #eee);
      color: inherit;
      text-decoration: none;
      box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.1);
    }
    .error-body a:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 rgba(0, 0, 0, 0.1); }
  </style>
</head>
<body>
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
    }
  </script>
  <div class="error-window" role="alertdialog" aria-labelledby="err-title">
    <div class="error-title-bar">System Message</div>
    <div class="error-body">
      <div class="glyph" aria-hidden="true">&#x1F4BE;</div>
      <h1 id="err-title">404 - page not found</h1>
      <p>The file you requested is not on this disk.</p>
      <a href="/">Return to desktop</a>
    </div>
  </div>
</body>
</html>
